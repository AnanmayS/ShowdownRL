[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "showdownrl"
version = "0.1.0"
description = "Watch an AI play Pokemon Showdown in a visible browser."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "ShowdownRL contributors"},
]
dependencies = [
  "numpy",
  "playwright>=1.45",
  "platformdirs>=4.0",
  "poke-env>=0.16",
]
license = {text = "MIT"}
keywords = ["pokemon", "showdown", "reinforcement-learning", "playwright"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
rl = [
  "gymnasium",
  "matplotlib",
  "numpy",
  "optuna",
  "pandas",
  "poke-env",
  "sb3-contrib",
  "stable-baselines3",
  "torch",
]

# Decision-time search (showdownrl/search.py). poke-engine ships only as an sdist
# (needs a Rust toolchain) and its default cargo feature is gen4, so it MUST be
# built with the gen9 terastallization feature, e.g.
#   CARGO_BUILD_JOBS=2 pip install --no-binary poke-engine poke-engine==0.0.48 \
#     --config-settings="build-args=--features poke-engine/terastallization --no-default-features"
# A plain `pip install .[search]` builds the gen4 engine (no tera, wrong mechanics).
search = [
  "poke-engine==0.0.48",
]

[project.scripts]
showdownrl = "showdownrl.cli:main"

[tool.setuptools]
packages = ["showdownrl"]

[tool.setuptools.data-files]
models = [
  "models/ppo_move_selection_v2_typed.zip",
  "models/ppo_move_selection_v3_rich.zip",
  "models/ppo_move_selection_v4_rich.zip",
  "models/ppo_move_selection_v5_rich_finetuned.zip",
  "models/maskable_ppo_move_selection_v6_rich.zip",
  "models/maskable_ppo_v11_conservative_3M.zip",
]
